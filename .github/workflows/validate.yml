name: Validate Road Alert
on:
  push:
    branches: [setup/road-alert-trial]
  pull_request:
    branches: [setup/road-alert-trial]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm run worker:check
