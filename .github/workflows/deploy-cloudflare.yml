name: Deploy Road Alert to Cloudflare

on:
  push:
    branches:
      - setup/road-alert-trial
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: road-alert-cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy Worker + Pages
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_API_TOKEN
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Validate Worker deployment configuration
        run: npm run worker:check

      - name: Deploy Worker API
        run: npm run worker:deploy

      - name: Deploy Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name road-alert --branch setup/road-alert-trial
